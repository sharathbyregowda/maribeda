<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>Maribeda</title>
  <meta name="description" content="Your private digital diary. No cloud, no accounts. All data stored locally." />

  <!-- Theme Color - Matches manifest and paints browser UI -->
  <meta name="theme-color" content="#4a90a4" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/maribeda-favicon.jpeg" />

  <!-- PWA Manifest (generated by vite-plugin-pwa) -->
  <!-- Note: vite-plugin-pwa will inject the manifest link automatically -->

  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maribeda" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Disable automatic phone/email/address detection -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Preload critical WASM for faster initialization -->
  <link rel="preload" href="/sql-wasm.wasm" as="fetch" crossorigin="anonymous" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
